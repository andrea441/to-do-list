<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="sidebar">
      <h2>Projects</h2>
      <hr />
      <ul id="projects"></ul>
      <button type="button" id="open-add-project-modal">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <title>plus</title>
          <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
        </svg>
        New Project
      </button>
    </div>

    <div id="main">
      <div id="main-header">
        <h2 id="main-title">Project Title</h2>
        <hr />
        <form id="create-task">
          <input
            type="text"
            placeholder="Add a task"
            id="task-title"
            required
          />
          <div id="create-task-footer">
            <button type="submit">Add</button>
          </div>
        </form>
      </div>

      <div id="tasks">
        <div class="task">
          <input type="checkbox" id="check-list" />
          <label for="check-list">Hola</label>
        </div>
      </div>
    </div>

    <dialog id="add-project-modal">
      <form id="add-project-form">
        <h2>Create new project</h2>
        <input
          type="text"
          id="project-name"
          name="project-name"
          placeholder="Enter name"
          autocomplete="off"
          spellcheck="false"
          required
        />
        <div id="add-project-modal-btns">
          <button type="button" id="add-project-cancel-btn">Cancel</button>
          <button type="submit" id="add-project-accept-btn">Accept</button>
        </div>
      </form>
    </dialog>

    <dialog id="add-task-modal">
      <form id="add-task-form">
        <h2>Create New Task</h2>
        <input type="text" />
      </form>
    </dialog>
  </body>
</html>

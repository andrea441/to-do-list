<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="sidebar">
      <h2>Projects</h2>
      <hr />
      <ul id="projects"></ul>
      <button type="button" id="open-add-project-modal">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <title>plus</title>
          <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
        </svg>
        New Project
      </button>
    </div>

    <div id="main">
      <div id="main-header">
        <h2 id="main-title"></h2>
        <hr />
        <form id="create-task">
          <input
            type="text"
            placeholder="Add a task"
            id="task-title"
            required
          />
          <div id="create-task-footer">
            <label for="due-date">Due Date:</label>
            <input type="date" name="due-date" id="task-due-date" />
            <button type="submit">Add</button>
          </div>
        </form>
      </div>

      <div id="tasks">
        <div class="task"></div>
      </div>
    </div>

    <dialog id="add-project-modal">
      <form id="add-project-form">
        <h2>Create new project</h2>
        <input
          type="text"
          id="project-name"
          name="project-name"
          placeholder="Enter name"
          autocomplete="off"
          spellcheck="false"
          required
        />
        <div class="modal-btns">
          <button type="button" id="add-project-cancel-btn">Cancel</button>
          <button type="submit" id="add-project-accept-btn">Accept</button>
        </div>
      </form>
    </dialog>

    <dialog id="edit-task-modal">
      <h2>Edit Task</h2>
      <form id="edit-task-form">
        <div class="form-field" id="name-field">
          <label for="task-name">Name</label>
          <input type="text" id="task-name" name="task-name" required />
        </div>
        <div class="form-field" id="description-field">
          <label for="task-descripcion">Description</label>
          <input
            type="text"
            id="task-description"
            name="task-descripcion"
            required
          />
        </div>
        <div class="form-field" id="due-date-field">
          <label for="task-date">Due Date</label>
          <input type="date" id="task-date" name="task-date" required />
        </div>
        <div class="form-field" id="priority-field">
          <label for="task-priority">Priority</label>
          <select name="task-priority" id="task-priority"></select>
        </div>
        <div class="modal-btns">
          <button type="button" id="edit-task-cancel-btn">Cancel</button>
          <button type="submit" id="edit-task-accept-btn">Accept</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
